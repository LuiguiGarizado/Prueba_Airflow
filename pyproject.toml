[project]
name = "airflow2"
version = "0.1.0"
description = "Pipeline ETL diario de ventas y devoluciones para DataMart S.A.S."
readme = "README.md"
authors = [
    { name = "LuiguiGarizado", email = "luiguigarizadocotes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
airflow2 = "airflow2:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
